<!doctype html>
<html lang="en">
<head>

<style>
/* Layout: one phone-width column, bottom tab bar, full-screen sheets for logging and editing. */
:root {
  --bg: #F4F4F7; --card: #FFFFFF; --card2: #EEEEF3; --fg: #16171B; --muted: #5C5E69;
  --track: #E6E6EC; --line: #E2E2E8;
  --acc-l: #7C3AED; --acc-d: #A78BFA; --soft-l: rgba(124,58,237,.10); --soft-d: rgba(167,139,250,.16);
  --acc: var(--acc-l); --soft: var(--soft-l); --on: #FFFFFF;
  --p: #DB2777; --c: #D97706; --f: #0D9488; --bad: #DC2626; --good: #15803D;
  --ui: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --num: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --r: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121318; --card: #1C1D24; --card2: #25262F; --fg: #F2F2F5; --muted: #A1A2AD;
  --track: #2C2D36; --line: #2E2F38; --acc: var(--acc-d); --soft: var(--soft-d); --on: #121318;
  --p: #F472B6; --c: #FBBF24; --f: #2DD4BF; --bad: #F87171; --good: #4ADE80; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121318; --card: #1C1D24; --card2: #25262F; --fg: #F2F2F5; --muted: #A1A2AD;
  --track: #2C2D36; --line: #2E2F38; --acc: var(--acc-d); --soft: var(--soft-d); --on: #121318;
  --p: #F472B6; --c: #FBBF24; --f: #2DD4BF; --bad: #F87171; --good: #4ADE80; color-scheme: dark;
}
:root[data-accent="green"] { --acc-l: #15803D; --acc-d: #4ADE80; --soft-l: rgba(21,128,61,.10); --soft-d: rgba(74,222,128,.16); }
:root[data-accent="blue"] { --acc-l: #0369A1; --acc-d: #7DD3FC; --soft-l: rgba(3,105,161,.10); --soft-d: rgba(125,211,252,.16); }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

#app { max-width: 480px; margin: 0 auto; min-height: 100%; }
.screen { padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.hdr { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
h2 { margin: 0; font-size: 17px; font-weight: 800; }
.pill { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--soft); color: var(--acc); white-space: nowrap; border: 0; }
.card { background: var(--card); border-radius: var(--r); padding: 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 800; background: var(--acc); color: var(--on); min-height: 46px; }
.btn.ghost { background: var(--card2); color: var(--fg); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card); display: grid; place-items: center; color: var(--fg); }
.add-btn { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--soft); color: var(--acc); font-size: 20px; font-weight: 800; display: grid; place-items: center; flex: none; }
.link { background: none; border: 0; color: var(--acc); font-weight: 700; padding: 6px 0; }

/* Ring */
.ring-card { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 16px; }
.ring { position: relative; width: 196px; height: 196px; }
.ring svg { display: block; }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .big { font-size: 44px; line-height: 1; }
.trio { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
.trio .num { font-size: 18px; }

/* Macro bars */
.macro { display: flex; flex-direction: column; gap: 6px; }
.macro .top { display: flex; justify-content: space-between; font-size: 14px; }
.bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; }

/* Lists */
.list { background: var(--card); border-radius: var(--r); padding: 2px 16px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: inherit; }
.item:last-child { border-bottom: 0; }
.item .name { font-weight: 700; font-size: 15px; display: block; }
.item .sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .sub.wrap { white-space: normal; }
.badge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: var(--soft); color: var(--acc); margin-left: 6px; vertical-align: 2px; text-transform: uppercase; letter-spacing: .04em; }
.empty { color: var(--muted); font-size: 14px; padding: 14px 0; }

.meal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0 4px; }
.meal-head h2 { font-size: 16px; }

/* Segmented */
.seg { display: flex; padding: 4px; border-radius: 14px; gap: 4px; background: var(--card); }
.seg button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--muted); min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--acc); color: var(--on); }
.tabs { display: flex; gap: 20px; font-size: 14px; font-weight: 700; padding: 2px 4px; }
.tabs button { border: 0; background: none; padding: 0 0 6px; color: var(--muted); font-weight: 700; border-bottom: 2px solid transparent; }
.tabs button[aria-pressed="true"] { color: var(--fg); border-color: var(--acc); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { border: 0; background: var(--card); color: var(--muted); padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--soft); color: var(--acc); }
.mchip { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: var(--card2); }

/* Forms */
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
.input, select.input { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--fg); min-height: 46px; }
.input:focus { border-color: var(--acc); outline: none; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.search { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 0 14px; }
.search input { border: 0; background: none; padding: 13px 0; flex: 1; min-width: 0; font-size: 16px; outline: none; }
.qty { display: flex; align-items: center; gap: 8px; }
.qty input { text-align: center; font-family: var(--num); font-weight: 700; font-size: 20px; }
.toggle { position: relative; width: 48px; height: 28px; border-radius: 999px; background: var(--track); border: 0; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 999px; background: #fff; transition: left .15s; }
.toggle[aria-checked="true"] { background: var(--acc); }
.toggle[aria-checked="true"]::after { left: 23px; }
.choice { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--card); border: 2px solid transparent; text-align: left; width: 100%; }
.choice[aria-pressed="true"] { border-color: var(--acc); background: var(--soft); }
.choice .t { font-weight: 800; }
.swatch { width: 34px; height: 34px; border-radius: 999px; border: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--fg); }

/* Nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line); padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav .in { max-width: 480px; margin: 0 auto; display: flex; align-items: center; justify-content: space-around; }
.nav .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 60px; min-height: 46px; justify-content: center; border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 700; }
.nav .tab[aria-current="page"] { color: var(--acc); }
.nav .plus { width: 58px; height: 58px; margin-top: -28px; border-radius: 20px; border: 0; background: var(--acc); color: var(--on); display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.18); }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet .in { max-width: 480px; margin: 0 auto; padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet .bar-top { display: flex; align-items: center; gap: 10px; }
.sheet .bar-top h1 { font-size: 22px; margin: 0; }
.stickybtn { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
.progress-dots { display: flex; gap: 6px; }
.progress-dots i { height: 4px; flex: 1; border-radius: 4px; background: var(--track); }
.progress-dots i.on { background: var(--acc); }
.note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { border: 0; color: inherit; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 2px; font-weight: 700; font-size: 12.5px; font-family: inherit; cursor: pointer; text-align: center; }
.scanbox { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; background: #000; }
.scanbox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scanframe { position: absolute; left: 8%; right: 8%; top: 30%; bottom: 30%; border: 3px solid rgba(255,255,255,.9); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
.scanframe::after { content: ''; position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: var(--acc); box-shadow: 0 0 10px var(--acc); animation: scanline 1.6s ease-in-out infinite alternate; }
.photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo-slot { position: relative; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: var(--card2); display: flex; align-items: center; justify-content: center; }
.photo-slot img { width: 100%; height: 100%; object-fit: cover; }
.photo-x { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.55); color: #fff; }
.photo-add { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--acc); font-weight: 700; font-size: 13px; cursor: pointer; width: 100%; height: 100%; justify-content: center; border: 2px dashed var(--line); border-radius: 14px; }
.mg { display: flex; gap: 14px; align-items: center; background: var(--card); border-radius: 18px; padding: 12px; }
.mg-fig { flex: none; width: 104px; height: 156px; }
.mg-txt { flex: 1; min-width: 0; }
.mg-line ellipse { fill: none; stroke: var(--muted); stroke-opacity: .12; stroke-width: 2; stroke-dasharray: 3 3; }
.mg-line.on ellipse { stroke: var(--acc); stroke-opacity: 1; stroke-width: 3; stroke-dasharray: none; }
/* Weekly story */
.sheet.story-mode { background: #0f0a1f; overflow: hidden; }
.sheet.story-mode .in { max-width: 480px; height: 100%; padding: 0; display: block; }
.story { --st-good: #4ADE80; --st-warn: #FBBF24; --p: #F472B6; --c: #FBBF24; --f: #2DD4BF; position: relative; height: 100dvh; color: #fff; overflow: hidden; padding: calc(12px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(120% 70% at 85% 0%, color-mix(in srgb, var(--acc-d) 55%, transparent), transparent 60%), radial-gradient(90% 60% at 0% 100%, rgba(125, 211, 252, .28), transparent 60%), linear-gradient(160deg, #1b1236, #0c0a18 70%);
  display: flex; flex-direction: column; }
.st-progress { display: flex; gap: 4px; }
.st-progress i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
.st-progress i b { display: block; height: 100%; width: 0; background: #fff; }
.st-progress i.done b { width: 100%; }
.st-progress i.now b { width: 100%; }
.st-progress i.now.run b { width: 0; animation: st-fill var(--dur) linear forwards; }
@keyframes st-fill { to { width: 100%; } }
.st-head { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 0; font-size: 13px; font-weight: 700; opacity: .75; position: relative; z-index: 3; }
.st-x { border: 0; background: rgba(255,255,255,.12); color: #fff; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; }
.st-tap { position: absolute; top: 70px; bottom: 0; z-index: 1; }
.st-tap.left { left: 0; width: 30%; } .st-tap.right { right: 0; width: 70%; }
.st-slide { position: relative; z-index: 2; pointer-events: none; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.st-slide button, .st-slide a { pointer-events: auto; }
.st-slide > *, .st-tiles > *, .st-tips > *, .st-top > * { animation: st-up .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 120ms); }
@keyframes st-up { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
.st-eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--acc-d); }
.st-huge { font-size: 48px; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; }
.st-big { font-size: 40px; font-weight: 800; line-height: 1.1; }
.st-mid { font-size: 24px; font-weight: 800; line-height: 1.15; }
.st-unit { font-size: 18px; font-weight: 700; opacity: .7; letter-spacing: 0; }
.st-sub { font-size: 17px; line-height: 1.45; opacity: .9; }
.st-small { font-size: 13.5px; line-height: 1.45; opacity: .75; }
.st-hint { position: relative; z-index: 2; text-align: center; font-size: 12px; opacity: .45; min-height: 16px; }
.st-bars { display: flex; gap: 8px; align-items: flex-end; height: 170px; margin-top: 8px; }
.st-barcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; font-size: 12px; opacity: .9; }
.st-bartrack { position: relative; flex: 1; width: 100%; border-radius: 10px; background: rgba(255,255,255,.08); overflow: hidden; }
.st-bartrack b { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 10px 10px 4px 4px; transform-origin: bottom; animation: st-grow .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d); }
.st-allow { position: absolute; left: -2px; right: -2px; height: 2px; background: #fff; opacity: .85; z-index: 1; }
@keyframes st-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.st-legend { font-size: 12.5px; opacity: .7; display: flex; align-items: center; gap: 8px; } .st-legend i { width: 16px; height: 2px; background: #fff; }
.st-ring { position: relative; width: 190px; height: 190px; align-self: center; }
.st-ring-bg { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 14; }
.st-ring-fg { fill: none; stroke: var(--p-d, #F472B6); stroke-width: 14; stroke-linecap: round; animation: st-ring 1.4s cubic-bezier(.2,.8,.2,1) both .3s; }
@keyframes st-ring { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: var(--off); } }
.st-ring-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; }
.st-ring-in span:last-child { font-size: 14px; font-weight: 700; opacity: .7; }
.st-slide .st-ring + .st-sub, .st-slide .st-ring ~ .st-sub { text-align: center; }
.st-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.st-tile { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 14px; }
.st-emoji { font-size: 26px; margin-bottom: 4px; }
.st-pill { align-self: flex-start; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; }
.st-pill.good { background: rgba(74,222,128,.18); color: var(--st-good); } .st-pill.warn { background: rgba(251,191,36,.18); color: var(--st-warn); }
.st-spark path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: st-draw 1.6s ease-out forwards .5s; }
.st-spark circle { fill: var(--acc-d); animation: st-up .4s both 2s; }
@keyframes st-draw { to { stroke-dashoffset: 0; } }
.st-top { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.st-top li { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.07); border-radius: 14px; padding: 10px 12px; }
.st-top li span { width: 26px; height: 26px; border-radius: 50%; background: var(--acc-d); color: #120d24; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.st-top li b { flex: 1; font-size: 15px; } .st-top li em { font-style: normal; opacity: .7; font-weight: 700; }
.st-verdict { display: flex; gap: 14px; align-items: center; background: rgba(255,255,255,.09); border-radius: 20px; padding: 14px; }
.st-vemoji { font-size: 44px; animation: st-pop .7s cubic-bezier(.2,1.6,.4,1) both .3s; }
@keyframes st-pop { from { transform: scale(0) rotate(-20deg); } to { transform: none; } }
.st-tips { display: flex; flex-direction: column; gap: 8px; }
.st-tip { border-radius: 16px; padding: 11px 13px; background: rgba(255,255,255,.06); border-left: 4px solid; display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; line-height: 1.45; }
.st-tip b { font-size: 15px; } .st-tip span { opacity: .85; }
.st-tip.good { border-color: var(--st-good); } .st-tip.good b { color: var(--st-good); }
.st-tip.warn { border-color: var(--st-warn); } .st-tip.warn b { color: var(--st-warn); }
.st-target { background: rgba(255,255,255,.09); border-radius: 20px; padding: 16px; }
.st-macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.st-macros div { background: rgba(255,255,255,.07); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.st-macros i { width: 22px; height: 4px; border-radius: 2px; } .st-macros b { font-size: 18px; } .st-macros span { font-size: 12.5px; opacity: .7; }
.st-btn { background: #fff !important; color: #120d24 !important; }
.st-btn2 { background: rgba(255,255,255,.12) !important; color: #fff !important; border: 0 !important; }
.st-nav { justify-content: space-between; position: relative; z-index: 3; } .st-nav .link { color: #fff; opacity: .8; }
